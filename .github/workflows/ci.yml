name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-workflows:
    name: Release workflow checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workflow test parser
        run: python -m pip install PyYAML==6.0.2

      - name: Run isolated release workflow tests with the runner Bash
        run: python -m unittest discover -s .github/scripts/tests -v

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Load read-only SSH deploy key (private feedback dependency)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FEEDBACK_DEPLOY_KEY }}

      # 子包依赖要先装：根目录 flutter analyze 会连 packages/ 下的测试一起检查，
      # 没有子包 package_config 时会报 65 个 package:test 解析错误。
      - name: Install dependencies (root)
        run: flutter pub get

      - name: Install dependencies (subsonic_api)
        working-directory: packages/subsonic_api
        run: flutter pub get

      - name: Run flutter analyze (root)
        run: flutter analyze

      - name: Run flutter analyze (subsonic_api)
        working-directory: packages/subsonic_api
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Load read-only SSH deploy key (private feedback dependency)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FEEDBACK_DEPLOY_KEY }}

      - name: Install dependencies (root)
        run: flutter pub get

      - name: Install dependencies (subsonic_api)
        working-directory: packages/subsonic_api
        run: flutter pub get

      - name: Run flutter test (root)
        run: flutter test

      - name: Run flutter test (subsonic_api)
        working-directory: packages/subsonic_api
        run: flutter test
