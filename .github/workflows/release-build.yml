name: Reusable Release Builds

on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
      version:
        type: string
        required: false
        default: ''
      build_number:
        type: string
        required: false
        default: ''
    secrets:
      FEEDBACK_DEPLOY_KEY:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true

permissions:
  contents: read

env:
  FEEDBACK_ENABLED: 'true'
  FEEDBACK_API_BASE: 'https://feedback.xn--fhqths51enha.cn'
  FEEDBACK_APP_ID: 'sakuramusic'
  PILOT_BUILD_VERSION: ${{ inputs.version }}
  PILOT_BUILD_NUMBER: ${{ inputs.build_number }}


jobs:
  validate-release:
    name: Validate Build Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable source and numeric version overrides
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.target_sha }}
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$BUILD_VERSION" || -n "$BUILD_NUMBER" ]]; then
            [[ "$BUILD_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
            (( BUILD_NUMBER <= 2147483647 ))
          fi

  test:
    name: Test
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Load read-only SSH deploy key (private feedback dependency)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FEEDBACK_DEPLOY_KEY }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android
    needs: [validate-release, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Keep Gradle out of the SDK auto-installer path that returned an invalid
      # ZIP in the Android release job. This is Google's SDK CMake package;
      # its SHA-256 was checked against the official repository's size/SHA-1.
      - name: Install verified CMake 3.22.1
        env:
          PILOT_CMAKE_SHA256: '9196644852a978012caf7a4067ba1898debf6cc204c3341562771e31080d6869'
        run: |
          set -euo pipefail
          cmake_root="$(mktemp -d "$RUNNER_TEMP/android-cmake-3.22.1.XXXXXX")"
          cmake_archive="$cmake_root/download.zip"
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 180 \
            --output "$cmake_archive" \
            https://dl.google.com/android/repository/cmake-3.22.1-linux.zip
          printf '%s  %s\n' "$PILOT_CMAKE_SHA256" "$cmake_archive" | shasum -a 256 --check -
          unzip -tq "$cmake_archive"
          unzip -q "$cmake_archive" -d "$cmake_root"
          "$cmake_root/bin/cmake" --version
          "$cmake_root/bin/ninja" --version
          printf '\ncmake.dir=%s\n' "$cmake_root" >> android/local.properties
          printf '%s\n' "$cmake_root/bin" >> "$GITHUB_PATH"

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\n' > android/app/key.properties

      - name: Load read-only SSH deploy key (private feedback dependency)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FEEDBACK_DEPLOY_KEY }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Split APKs
        run: |
          set -euo pipefail
          set --
          if [[ -n "$PILOT_BUILD_VERSION" ]]; then set -- --build-name "$PILOT_BUILD_VERSION" --build-number "$PILOT_BUILD_NUMBER"; fi
          flutter build apk --release --split-per-abi --dart-define=FEEDBACK_ENABLED=${{ env.FEEDBACK_ENABLED }} --dart-define=FEEDBACK_API_BASE=${{ env.FEEDBACK_API_BASE }} --dart-define=FEEDBACK_APP_ID=${{ env.FEEDBACK_APP_ID }} "$@"

      - name: Build Android Universal APK
        run: |
          set -euo pipefail
          set --
          if [[ -n "$PILOT_BUILD_VERSION" ]]; then set -- --build-name "$PILOT_BUILD_VERSION" --build-number "$PILOT_BUILD_NUMBER"; fi
          flutter build apk --release --dart-define=FEEDBACK_ENABLED=${{ env.FEEDBACK_ENABLED }} --dart-define=FEEDBACK_API_BASE=${{ env.FEEDBACK_API_BASE }} --dart-define=FEEDBACK_APP_ID=${{ env.FEEDBACK_APP_ID }} "$@"

      - name: Collect Android Assets
        run: |
          mkdir -p release-assets/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/android/SakuraMusic-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/android/SakuraMusic-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/android/SakuraMusic-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/android/SakuraMusic-android-universal.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          overwrite: true
          path: release-assets/android/*

  build-windows:
    name: Build Windows
    needs: [validate-release, test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Load read-only SSH deploy key (private feedback dependency)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FEEDBACK_DEPLOY_KEY }}

      # dart pub reads a git dependency's pubspec.yaml through `git show` and
      # decodes stdout with the Windows ANSI codepage (CP_ACP); the package's
      # non-ASCII description then fails YAML parsing. Vendor the pinned commit
      # with an ASCII-only pubspec and redirect via pubspec_overrides.yaml —
      # CI-local only; the committed pubspec/lockfile stay pinned to the SHA.
      - name: Vendor feedback_widget (Windows pub codepage workaround)
        shell: bash
        run: |
          set -euo pipefail
          mkdir .ci-feedback
          git -C .ci-feedback init -q
          git -C .ci-feedback remote add origin git@github.com:SakuraLoveSmile/Sakura-Feedback.git
          git -C .ci-feedback fetch -q --depth 1 origin 60a9b22eb85904a023dcb60852f3d6be1792f684
          git -C .ci-feedback checkout -q --detach FETCH_HEAD
          tr -d '\200-\377' < .ci-feedback/flutter/feedback/pubspec.yaml > .ci-feedback/flutter/feedback/pubspec.ascii.yaml
          mv .ci-feedback/flutter/feedback/pubspec.ascii.yaml .ci-feedback/flutter/feedback/pubspec.yaml
          printf 'dependency_overrides:\n  feedback_widget:\n    path: .ci-feedback/flutter/feedback\n' > pubspec_overrides.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        shell: bash
        run: |
          set -euo pipefail
          set --
          if [[ -n "$PILOT_BUILD_VERSION" ]]; then set -- --build-name "$PILOT_BUILD_VERSION" --build-number "$PILOT_BUILD_NUMBER"; fi
          flutter build windows --release --dart-define=FEEDBACK_ENABLED=${{ env.FEEDBACK_ENABLED }} --dart-define=FEEDBACK_API_BASE=${{ env.FEEDBACK_API_BASE }} --dart-define=FEEDBACK_APP_ID=${{ env.FEEDBACK_APP_ID }} "$@"

      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets/windows
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release-assets\windows\SakuraMusic-windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          overwrite: true
          path: release-assets/windows/*

  build-macos:
    name: Build macOS
    needs: [validate-release, test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Load read-only SSH deploy key (private feedback dependency)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FEEDBACK_DEPLOY_KEY }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: |
          set -euo pipefail
          set --
          if [[ -n "$PILOT_BUILD_VERSION" ]]; then set -- --build-name "$PILOT_BUILD_VERSION" --build-number "$PILOT_BUILD_NUMBER"; fi
          flutter build macos --release --dart-define=FEEDBACK_ENABLED=${{ env.FEEDBACK_ENABLED }} --dart-define=FEEDBACK_API_BASE=${{ env.FEEDBACK_API_BASE }} --dart-define=FEEDBACK_APP_ID=${{ env.FEEDBACK_APP_ID }} "$@"

      - name: Package macOS App
        run: |
          mkdir -p release-assets/macos
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/sakuramusic.app release-assets/macos/SakuraMusic-macos.zip
          hdiutil create -volname "SakuraMusic" -srcfolder "build/macos/Build/Products/Release/sakuramusic.app" -ov -format UDZO "release-assets/macos/SakuraMusic-macos.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          overwrite: true
          path: release-assets/macos/*

  build-ios:
    name: Build iOS
    needs: [validate-release, test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Load read-only SSH deploy key (private feedback dependency)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FEEDBACK_DEPLOY_KEY }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: |
          set -euo pipefail
          set --
          if [[ -n "$PILOT_BUILD_VERSION" ]]; then set -- --build-name "$PILOT_BUILD_VERSION" --build-number "$PILOT_BUILD_NUMBER"; fi
          flutter build ios --release --no-codesign --dart-define=FEEDBACK_ENABLED=${{ env.FEEDBACK_ENABLED }} --dart-define=FEEDBACK_API_BASE=${{ env.FEEDBACK_API_BASE }} --dart-define=FEEDBACK_APP_ID=${{ env.FEEDBACK_APP_ID }} "$@"

      - name: Package iOS IPA & App
        run: |
          mkdir -p release-assets/ios
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r -9 ../../release-assets/ios/SakuraMusic-ios-unsigned.ipa Payload
          cd ../..
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release-assets/ios/SakuraMusic-ios-Runner.app.zip

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          overwrite: true
          path: release-assets/ios/*

