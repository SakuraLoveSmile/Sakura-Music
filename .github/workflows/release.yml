name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

# Feedback wiring passed to every platform build. Matches the defaults in
# lib/core/feedback/feedback_config.dart (enabled for official builds, the
# production service, appId `sakuramusic`); declared here so packaging is
# explicit and auditable, and overridable per run.
env:
  FEEDBACK_ENABLED: 'true'
  FEEDBACK_API_BASE: 'https://feedback.xn--fhqths51enha.cn'
  FEEDBACK_APP_ID: 'sakuramusic'

jobs:
  validate-release:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      release_channel: ${{ steps.validate.outputs.release_channel }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      make_latest: ${{ steps.validate.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag and pubspec version
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_TAG_NAME"
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "workflow_dispatch requires a non-empty tag_name" >&2
              exit 1
            fi
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is not a valid app version: $RELEASE_TAG" >&2
            exit 1
          fi

          PUBSPEC_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml | head -n 1)"
          PUBSPEC_BASE_VERSION="${PUBSPEC_VERSION%%+*}"
          if [[ -z "$PUBSPEC_VERSION" || "$PUBSPEC_BASE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec.yaml version $PUBSPEC_VERSION" >&2
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "pubspec version: $PUBSPEC_VERSION"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          # Keep every previously accepted tag publishable. Only canonical
          # numeric stable tags may advance the stable updater channel.
          if [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
          else
            echo "release_channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Build packages
    needs: validate-release
    uses: ./.github/workflows/release-build.yml
    with:
      target_sha: ${{ github.sha }}
    secrets:
      FEEDBACK_DEPLOY_KEY: ${{ secrets.FEEDBACK_DEPLOY_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

  publish-release:
    name: Publish GitHub Release
    needs: [validate-release, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.dmg" -o -name "*.ipa" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Determine Release Tag
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-files/*
          overwrite_files: false
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate-release.outputs.prerelease }}
          make_latest: ${{ needs.validate-release.outputs.make_latest }}

      - name: Generate version manifest
        if: ${{ needs.validate-release.outputs.release_channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pilot_release.py legacy-manifest "$RELEASE_TAG" "$RUNNER_TEMP/lyricon_manifest/latest.json"

      - name: Commit manifest to main without regressing a newer stable version
        if: ${{ needs.validate-release.outputs.release_channel == 'stable' }}
        run: python3 .github/scripts/pilot_release.py update-latest . "$RUNNER_TEMP/lyricon_manifest/latest.json"
