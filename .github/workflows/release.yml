name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag and pubspec version
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_TAG_NAME"
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "workflow_dispatch requires a non-empty tag_name" >&2
              exit 1
            fi
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is not a valid app version: $RELEASE_TAG" >&2
            exit 1
          fi

          PUBSPEC_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml | head -n 1)"
          PUBSPEC_BASE_VERSION="${PUBSPEC_VERSION%%+*}"
          if [[ -z "$PUBSPEC_VERSION" || "$PUBSPEC_BASE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec.yaml version $PUBSPEC_VERSION" >&2
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "pubspec version: $PUBSPEC_VERSION"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android
    needs: [validate-release, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\n' > android/app/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android Universal APK
        run: flutter build apk --release

      - name: Collect Android Assets
        run: |
          mkdir -p release-assets/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/android/SakuraMusic-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/android/SakuraMusic-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/android/SakuraMusic-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/android/SakuraMusic-android-universal.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/android/*

  build-windows:
    name: Build Windows
    needs: [validate-release, test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets/windows
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release-assets\windows\SakuraMusic-windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows/*

  build-macos:
    name: Build macOS
    needs: [validate-release, test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          mkdir -p release-assets/macos
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/sakuramusic.app release-assets/macos/SakuraMusic-macos.zip
          hdiutil create -volname "SakuraMusic" -srcfolder "build/macos/Build/Products/Release/sakuramusic.app" -ov -format UDZO "release-assets/macos/SakuraMusic-macos.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-assets/macos/*

  build-ios:
    name: Build iOS
    needs: [validate-release, test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA & App
        run: |
          mkdir -p release-assets/ios
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r -9 ../../release-assets/ios/SakuraMusic-ios-unsigned.ipa Payload
          cd ../..
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release-assets/ios/SakuraMusic-ios-Runner.app.zip

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-assets/ios/*

  publish-release:
    name: Publish GitHub Release
    needs: [validate-release, build-android, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.dmg" -o -name "*.ipa" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Determine Release Tag
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Generate version manifest
        run: |
          mkdir -p "$RUNNER_TEMP/lyricon_manifest"
          RELEASE_TAG="${{ env.RELEASE_TAG }}"
          BASE_URL="https://github.com/SakuraLoveSmile/Sakura-Music/releases/download/${RELEASE_TAG}"
          PAGE_URL="https://github.com/SakuraLoveSmile/Sakura-Music/releases/tag/${RELEASE_TAG}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          assets_json="[]"
          for f in release-files/*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            size="$(stat -c%s "$f")"
            digest="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            url="${BASE_URL}/${name}"
            asset="$(jq -n \
              --arg name "$name" \
              --arg url "$url" \
              --argjson size "$size" \
              --arg digest "$digest" \
              '{name: $name, browser_download_url: $url, size: $size, digest: $digest}')"
            assets_json="$(echo "$assets_json" | jq --argjson a "$asset" '. + [$a]')"
          done

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg page "$PAGE_URL" \
            --arg published "$PUBLISHED_AT" \
            --argjson assets "$assets_json" \
            '{tag_name: $tag, html_url: $page, body: "", published_at: $published, assets: $assets}' \
            > "$RUNNER_TEMP/lyricon_manifest/latest.json"

          echo "Generated release/latest.json:"
          cat "$RUNNER_TEMP/lyricon_manifest/latest.json"

      - name: Commit manifest to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p release
          cp "$RUNNER_TEMP/lyricon_manifest/latest.json" release/latest.json
          git add release/latest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "[skip ci] chore: update latest.json manifest for ${{ env.RELEASE_TAG }}"
            git push origin main
          fi
