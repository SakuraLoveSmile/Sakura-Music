name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

# Feedback wiring passed to every platform build. Matches the defaults in
# lib/core/feedback/feedback_config.dart (enabled for official builds, the
# production service, appId `sakuramusic`); declared here so packaging is
# explicit and auditable, and overridable per run.
env:
  FEEDBACK_ENABLED: 'true'
  FEEDBACK_API_BASE: 'https://feedback.xn--fhqths51enha.cn'
  FEEDBACK_APP_ID: 'sakuramusic'

jobs:
  validate-release:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      make_latest: ${{ steps.validate.outputs.make_latest }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout immutable tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          path: release-source
          persist-credentials: false
      - name: Read the actual no-override package version
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_TAG_NAME"
            [[ -n "$RELEASE_TAG" ]]
          fi
          python3 .github/scripts/pilot_release.py source-version release-source/pubspec.yaml "$RELEASE_TAG"
      - name: Freeze tag and source identity
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_TAG_NAME"
          fi
          SOURCE_SHA="$(git -C release-source rev-parse HEAD)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C release-source rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Build packages
    needs: validate-release
    uses: ./.github/workflows/release-build.yml
    with:
      target_sha: ${{ needs.validate-release.outputs.target_sha }}
    secrets:
      FEEDBACK_DEPLOY_KEY: ${{ secrets.FEEDBACK_DEPLOY_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

  publish-release:
    name: Publish GitHub Release
    needs: [validate-release, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: Checkout exact package source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}
          path: release-source
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare unique complete release assets
        run: python3 .github/scripts/pilot_release.py collect-legacy artifacts release-files

      - name: Determine Release Tag
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Reject retained packages with a different build identity
        env:
          FROZEN_TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pilot_release.py legacy-preflight "$RELEASE_TAG" release-source/pubspec.yaml release-files "$FROZEN_TARGET_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-files/*
          overwrite_files: false
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate-release.outputs.prerelease }}
          make_latest: ${{ needs.validate-release.outputs.make_latest }}

      - name: Generate version manifest from verified retained packages
        env:
          FROZEN_TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pilot_release.py legacy-manifest "$RELEASE_TAG" release-source/pubspec.yaml release-files "$RUNNER_TEMP/lyricon_manifest/candidate.json" "$FROZEN_TARGET_SHA"

      - name: Advance eligible updater channels without regressing concurrent releases
        run: python3 .github/scripts/pilot_release.py update-channels . "$RUNNER_TEMP/lyricon_manifest/candidate.json"
